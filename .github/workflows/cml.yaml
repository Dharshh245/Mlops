name: CML experiment report

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so `dvc ... diff main` can read main's files

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get data (DVC remote, or regenerate the identical file)
        run: |
          dvc pull data/iris.csv || python src/get_data.py
          dvc status data/iris.csv.dvc

      - name: Reproduce the pipeline
        run: dvc repro

            - name: Upload plots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: plots
          path: plots/

      - name: Build and post CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main:main || true

          echo "## Iris experiment report" > report.md
          echo "" >> report.md
          echo "### Metrics (this PR)" >> report.md
          dvc metrics show --md >> report.md

          echo "### Metrics diff vs main" >> report.md
          dvc metrics diff main --md >> report.md

          echo "### Params diff vs main" >> report.md
          dvc params diff main --md >> report.md

          echo "### Confusion matrix" >> report.md
          echo "Image saved as the **plots** artifact of [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." >> report.md
          echo '```' >> report.md
          python -c "import pandas as pd,pickle;from sklearn.metrics import confusion_matrix;t=pd.read_csv('data/prepared/test.csv');m=pickle.load(open('models/model.pkl','rb'));print(pd.DataFrame(confusion_matrix(t.target,m.predict(t.drop(columns='target'))),index=['setosa','versicolor','virginica'],columns=['setosa','versicolor','virginica']))" >> report.md
          echo '```' >> report.md

          cml comment create --publish=false report.mdgit checkout exp/max-depth-1
